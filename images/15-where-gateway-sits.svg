<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520">
  <rect width="960" height="520" fill="#f4f7fb"/>
  <text x="32" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#16324f">The gateway is the only public door</text>
  <text x="32" y="66" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c6b7a">Priya's browser has one address. The shop services stay on the private network.</text>

  <rect x="32" y="100" width="200" height="88" rx="12" fill="#16324f"/>
  <text x="52" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Priya's browser</text>
  <text x="52" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#d6e4f0">shop.harbor.local</text>

  <line x1="232" y1="144" x2="300" y2="144" stroke="#1d6fbf" stroke-width="2"/>
  <polygon points="300,138 312,144 300,150" fill="#1d6fbf"/>
  <text x="236" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1d6fbf">HTTPS</text>

  <rect x="312" y="88" width="250" height="112" rx="12" fill="#1d6fbf"/>
  <text x="332" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">API gateway</text>
  <text x="332" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#d6e4f0">TLS, routes, rate limits</text>
  <text x="332" y="174" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#d6e4f0">token check on the way in</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="13">
    <rect x="640" y="96" width="288" height="300" rx="12" fill="#ffffff" stroke="#d5deea"/>
    <text x="656" y="128" font-size="14" font-weight="700" fill="#16324f">Private network only</text>
    <text x="656" y="164" fill="#1c2833">identity:8080</text>
    <text x="656" y="190" fill="#1c2833">catalog:8080</text>
    <text x="656" y="216" fill="#1c2833">cart:8080</text>
    <text x="656" y="242" fill="#1c2833">orders:8080</text>
    <text x="656" y="268" fill="#1c2833">search:8080</text>
    <text x="656" y="304" fill="#5c6b7a">inventory, payments,</text>
    <text x="656" y="326" fill="#5c6b7a">Kafka: no public route</text>
    <text x="656" y="362" fill="#0e7c66">Orders calls payments</text>
    <text x="656" y="382" fill="#0e7c66">directly, not via Priya.</text>
  </g>

  <line x1="562" y1="144" x2="640" y2="180" stroke="#0e7c66" stroke-width="2"/>
  <polygon points="632,170 640,180 624,178" fill="#0e7c66"/>

  <rect x="32" y="400" width="896" height="88" rx="12" fill="#ffffff" stroke="#d5deea"/>
  <text x="52" y="436" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#16324f">One address she can bookmark</text>
  <text x="52" y="464" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1c2833">https://shop.harbor.local/api/orders goes to the orders service. She never learns that orders listens on port 8080.</text>
</svg>
