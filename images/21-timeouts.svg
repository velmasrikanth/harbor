<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400">
  <rect width="960" height="400" fill="#f4f7fb"/>
  <text x="32" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#16324f">Two clocks on one checkout</text>

  <rect x="32" y="80" width="896" height="16" rx="8" fill="#d5deea"/>
  <rect x="32" y="80" width="280" height="16" rx="8" fill="#1d6fbf"/>
  <text x="32" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1d6fbf">Connect: 1 second to open TCP to orders</text>

  <rect x="32" y="160" width="896" height="16" rx="8" fill="#d5deea"/>
  <rect x="32" y="160" width="640" height="16" rx="8" fill="#0e7c66"/>
  <text x="32" y="204" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#0e7c66">Read: 10 seconds for orders to finish POST /api/orders</text>

  <rect x="32" y="240" width="896" height="16" rx="8" fill="#d5deea"/>
  <rect x="32" y="240" width="420" height="16" rx="8" fill="#b86e00"/>
  <text x="32" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#b86e00">Catalog read timer is shorter: 3 seconds for GET /api/products</text>

  <rect x="32" y="312" width="896" height="64" rx="12" fill="#ffffff" stroke="#d5deea"/>
  <text x="52" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1c2833">If the read timer fires, Priya sees 504. Orders might still be writing order 1001. A gateway retry of that POST could create a second order.</text>
</svg>
