<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460">
  <rect width="960" height="460" fill="#f4f7fb"/>
  <text x="32" y="42" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#16324f">Two different questions</text>

  <rect x="32" y="74" width="430" height="250" rx="12" fill="#ffffff" stroke="#1d6fbf" stroke-width="2"/>
  <text x="52" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1d6fbf">Authentication</text>
  <text x="52" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#16324f">Who is this?</text>
  <text x="52" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1c2833">Priya types her email and password.</text>
  <text x="52" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1c2833">Identity hashes the password and</text>
  <text x="52" y="234" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1c2833">compares it with the stored hash.</text>
  <text x="52" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#0e7c66">Match: we know the caller is Priya.</text>

  <rect x="498" y="74" width="430" height="250" rx="12" fill="#ffffff" stroke="#b86e00" stroke-width="2"/>
  <text x="518" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#b86e00">Authorization</text>
  <text x="518" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#16324f">What may this person do?</text>
  <text x="518" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1c2833">Priya's role is CUSTOMER.</text>
  <text x="518" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1c2833">She may place her own order.</text>
  <text x="518" y="234" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1c2833">She may not refund order 1001.</text>
  <text x="518" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9f3a38">A correct password does not grant a refund.</text>

  <rect x="32" y="348" width="896" height="84" rx="12" fill="#16324f"/>
  <text x="52" y="382" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#ffffff">Example: Arun's password also checks out. That only proves he is Arun.</text>
  <text x="52" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#ffffff">His SUPPORT role is what allows POST /orders/1001/refund.</text>
</svg>
