<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520">
  <rect width="960" height="520" fill="#f4f7fb"/>
  <text x="32" y="42" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#16324f">Roles on one order</text>
  <text x="32" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c6b7a">Order 1001 is Priya's copper kettle, Rs 2,499, status PAID.</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="14">
    <rect x="32" y="100" width="288" height="250" rx="12" fill="#ffffff" stroke="#1d6fbf" stroke-width="2"/>
    <text x="48" y="136" font-size="16" font-weight="700" fill="#16324f">Priya, CUSTOMER</text>
    <text x="48" y="176" fill="#0e7c66">GET /orders  allowed</text>
    <text x="48" y="202" fill="#5c6b7a">only her own rows</text>
    <text x="48" y="240" fill="#0e7c66">POST /orders  allowed</text>
    <text x="48" y="278" fill="#9f3a38">refund  refused, 403</text>

    <rect x="336" y="100" width="288" height="250" rx="12" fill="#ffffff" stroke="#0e7c66" stroke-width="2"/>
    <text x="352" y="136" font-size="16" font-weight="700" fill="#16324f">Arun, SUPPORT</text>
    <text x="352" y="176" fill="#0e7c66">GET /orders/1001  allowed</text>
    <text x="352" y="214" fill="#0e7c66">POST refund  allowed</text>
    <text x="352" y="252" fill="#9f3a38">change kettle price</text>
    <text x="352" y="278" fill="#9f3a38">refused, 403</text>

    <rect x="640" y="100" width="288" height="250" rx="12" fill="#ffffff" stroke="#b86e00" stroke-width="2"/>
    <text x="656" y="136" font-size="16" font-weight="700" fill="#16324f">Meera, ADMIN</text>
    <text x="656" y="176" fill="#0e7c66">assign SUPPORT to Arun</text>
    <text x="656" y="214" fill="#0e7c66">disable a user</text>
    <text x="656" y="252" fill="#5c6b7a">still uses her own token</text>
    <text x="656" y="278" fill="#5c6b7a">for admin actions</text>
  </g>

  <rect x="32" y="376" width="896" height="112" rx="12" fill="#ffffff" stroke="#d5deea"/>
  <text x="52" y="412" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#16324f">Role plus ownership</text>
  <text x="52" y="442" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1c2833">CUSTOMER is not enough for GET /orders/1001. The order's user id must equal the token's sub.</text>
  <text x="52" y="466" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1c2833">Otherwise Priya, with a valid token, could read another customer's order by changing 1001 to 1002.</text>
</svg>
