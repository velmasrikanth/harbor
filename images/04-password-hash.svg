<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#f4f7fb"/>
  <text x="32" y="42" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#16324f">What gets stored when Priya registers</text>
  <text x="32" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c6b7a">The password stays on the way in. The database keeps a slow hash plus a unique salt.</text>

  <rect x="32" y="100" width="250" height="88" rx="10" fill="#ffffff" stroke="#1d6fbf" stroke-width="2"/>
  <text x="48" y="134" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c6b7a">Priya types</text>
  <text x="48" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#16324f">Kettle#2026</text>

  <line x1="282" y1="144" x2="322" y2="144" stroke="#1d6fbf" stroke-width="2"/>
  <polygon points="322,138 334,144 322,150" fill="#1d6fbf"/>

  <rect x="334" y="100" width="280" height="88" rx="10" fill="#ffffff" stroke="#0e7c66" stroke-width="2"/>
  <text x="350" y="134" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c6b7a">Identity mixes in her salt</text>
  <text x="350" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#16324f">salt 9f3a21</text>

  <line x1="614" y1="144" x2="654" y2="144" stroke="#1d6fbf" stroke-width="2"/>
  <polygon points="654,138 666,144 654,150" fill="#1d6fbf"/>

  <rect x="666" y="100" width="262" height="88" rx="10" fill="#16324f"/>
  <text x="682" y="134" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#d6e4f0">Argon2id produces</text>
  <text x="682" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">a long hash</text>

  <rect x="32" y="220" width="896" height="120" rx="12" fill="#ffffff" stroke="#d5deea"/>
  <text x="52" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#16324f">Row in the users table</text>
  <text x="52" y="286" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1c2833">email: priya@example.com</text>
  <text x="52" y="310" font-family="Consolas, Courier New, monospace" font-size="14" fill="#1c2833">password_hash: $argon2id$v=19$...    salt: 9f3a21    status: ACTIVE</text>

  <rect x="32" y="364" width="430" height="144" rx="12" fill="#e7f6f1" stroke="#0e7c66"/>
  <text x="52" y="398" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#0e7c66">Login check</text>
  <text x="52" y="428" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1c2833">Hash the password she types today,</text>
  <text x="52" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1c2833">using the same salt. Compare hashes.</text>
  <text x="52" y="480" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1c2833">Equal hashes mean the password matches.</text>

  <rect x="498" y="364" width="430" height="144" rx="12" fill="#fdecec" stroke="#9f3a38"/>
  <text x="518" y="398" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#9f3a38">What must not happen</text>
  <text x="518" y="428" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1c2833">The database must not contain</text>
  <text x="518" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1c2833">Kettle#2026 in readable form.</text>
  <text x="518" y="480" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1c2833">Logs must not contain it either.</text>
</svg>
