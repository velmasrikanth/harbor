<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640">
  <rect width="960" height="640" fill="#f4f7fb"/>
  <text x="32" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#16324f">What the gateway does with GET /api/orders</text>
  <text x="32" y="66" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c6b7a">Priya already has an access token. These steps happen before orders sees the call.</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1c2833">
    <rect x="250" y="88" width="460" height="44" rx="8" fill="#16324f"/>
    <text x="480" y="116" text-anchor="middle" fill="#ffffff">1. Accept HTTPS and end TLS</text>
    <rect x="230" y="148" width="500" height="44" rx="8" fill="#ffffff" stroke="#1d6fbf" stroke-width="2"/>
    <text x="480" y="176" text-anchor="middle">2. Give the call a request id</text>
    <rect x="190" y="208" width="580" height="44" rx="8" fill="#ffffff" stroke="#1d6fbf" stroke-width="2"/>
    <text x="480" y="236" text-anchor="middle">3. Match /api/orders to the orders upstream</text>
    <rect x="170" y="268" width="620" height="44" rx="8" fill="#fff7ed" stroke="#b86e00" stroke-width="2"/>
    <text x="480" y="296" text-anchor="middle">4. Rate limit. Too many calls return 429 here.</text>
    <rect x="150" y="328" width="660" height="44" rx="8" fill="#fff7ed" stroke="#b86e00" stroke-width="2"/>
    <text x="480" y="356" text-anchor="middle">5. Check the JWT. Missing or bad token returns 401 here.</text>
    <rect x="170" y="388" width="620" height="44" rx="8" fill="#ffffff" stroke="#0e7c66" stroke-width="2"/>
    <text x="480" y="416" text-anchor="middle">6. Pick a healthy orders copy and start the timer</text>
    <rect x="150" y="448" width="660" height="44" rx="8" fill="#e7f6f1" stroke="#0e7c66" stroke-width="2"/>
    <text x="480" y="476" text-anchor="middle">7. Forward the call. Orders still checks role and ownership.</text>
    <rect x="210" y="508" width="540" height="44" rx="8" fill="#16324f"/>
    <text x="480" y="536" text-anchor="middle" fill="#ffffff">8. Log status and time. Do not log the token.</text>
  </g>
  <text x="32" y="600" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c6b7a">A failure at step 4 or 5 never wakes the orders process.</text>
</svg>
