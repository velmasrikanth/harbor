<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
  <rect width="960" height="560" fill="#f4f7fb"/>
  <text x="32" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#16324f">Identity's own PostgreSQL</text>
  <text x="32" y="66" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5c6b7a">No other service reads these tables. They store Priya's id, then keep their own rows.</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="32" y="96" width="280" height="180" rx="10" fill="#ffffff" stroke="#1d6fbf" stroke-width="2"/>
    <rect x="32" y="96" width="280" height="36" rx="10" fill="#1d6fbf"/>
    <rect x="32" y="116" width="280" height="16" fill="#1d6fbf"/>
    <text x="48" y="120" font-size="15" font-weight="700" fill="#ffffff">users</text>
    <text x="48" y="160" font-size="13" fill="#1c2833">id</text>
    <text x="48" y="182" font-size="13" fill="#1c2833">email</text>
    <text x="48" y="204" font-size="13" fill="#1c2833">password_hash, salt</text>
    <text x="48" y="226" font-size="13" fill="#1c2833">status: ACTIVE or DISABLED</text>
    <text x="48" y="248" font-size="13" fill="#1c2833">created_at</text>

    <rect x="340" y="96" width="280" height="140" rx="10" fill="#ffffff" stroke="#0e7c66" stroke-width="2"/>
    <rect x="340" y="96" width="280" height="36" rx="10" fill="#0e7c66"/>
    <rect x="340" y="116" width="280" height="16" fill="#0e7c66"/>
    <text x="356" y="120" font-size="15" font-weight="700" fill="#ffffff">roles</text>
    <text x="356" y="160" font-size="13" fill="#1c2833">id</text>
    <text x="356" y="182" font-size="13" fill="#1c2833">name</text>
    <text x="356" y="208" font-size="13" fill="#5c6b7a">CUSTOMER, SUPPORT, ADMIN</text>

    <rect x="648" y="96" width="280" height="160" rx="10" fill="#ffffff" stroke="#b86e00" stroke-width="2"/>
    <rect x="648" y="96" width="280" height="36" rx="10" fill="#b86e00"/>
    <rect x="648" y="116" width="280" height="16" fill="#b86e00"/>
    <text x="664" y="120" font-size="15" font-weight="700" fill="#ffffff">user_roles</text>
    <text x="664" y="160" font-size="13" fill="#1c2833">user_id</text>
    <text x="664" y="182" font-size="13" fill="#1c2833">role_id</text>
    <text x="664" y="214" font-size="13" fill="#5c6b7a">Priya can hold one role now.</text>
    <text x="664" y="234" font-size="13" fill="#5c6b7a">The table allows more later.</text>

    <rect x="32" y="320" width="430" height="200" rx="10" fill="#ffffff" stroke="#16324f" stroke-width="2"/>
    <rect x="32" y="320" width="430" height="36" rx="10" fill="#16324f"/>
    <rect x="32" y="340" width="430" height="16" fill="#16324f"/>
    <text x="48" y="344" font-size="15" font-weight="700" fill="#ffffff">refresh_tokens</text>
    <text x="48" y="386" font-size="13" fill="#1c2833">id, user_id</text>
    <text x="48" y="410" font-size="13" fill="#1c2833">token_hash</text>
    <text x="48" y="434" font-size="13" fill="#1c2833">expires_at</text>
    <text x="48" y="458" font-size="13" fill="#1c2833">revoked: true or false</text>
    <text x="48" y="490" font-size="13" fill="#5c6b7a">The raw refresh token is not stored.</text>

    <rect x="490" y="320" width="438" height="200" rx="10" fill="#ffffff" stroke="#9f3a38" stroke-width="2"/>
    <rect x="490" y="320" width="438" height="36" rx="10" fill="#9f3a38"/>
    <rect x="490" y="340" width="438" height="16" fill="#9f3a38"/>
    <text x="506" y="344" font-size="15" font-weight="700" fill="#ffffff">audit_log</text>
    <text x="506" y="386" font-size="13" fill="#1c2833">user_id, action, result</text>
    <text x="506" y="410" font-size="13" fill="#1c2833">ip, created_at</text>
    <text x="506" y="442" font-size="13" fill="#1c2833">actions: LOGIN_OK, LOGIN_FAIL,</text>
    <text x="506" y="464" font-size="13" fill="#1c2833">LOGOUT, ROLE_CHANGE</text>
    <text x="506" y="492" font-size="13" fill="#5c6b7a">Never write the password or the token here.</text>
  </g>
</svg>
